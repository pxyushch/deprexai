services:
  - type: web
    name: deprexai-api
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: PREFER_GPU
        value: "false"
      - key: STRICT_MODEL_COUNT
        value: "false"
      - key: PROCESSING_PROFILE
        value: balanced
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: deprexai-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: deprexai-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: deprexai-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
